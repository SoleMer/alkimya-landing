<section id="inicio" class="relative overflow-hidden pb-20 pt-32 sm:pb-28 sm:pt-40">
  <!-- Glows de fondo -->
  <div class="pointer-events-none absolute -left-32 top-10 h-96 w-96 rounded-full bg-primary-500/20 blur-3xl" aria-hidden="true"></div>
  <div class="pointer-events-none absolute -right-24 bottom-0 h-80 w-80 rounded-full bg-accent-400/10 blur-3xl" aria-hidden="true"></div>

  <div class="relative mx-auto grid max-w-6xl items-center gap-12 px-4 sm:px-6 lg:grid-cols-[1.4fr_1fr] lg:px-8">
    <div class="text-center lg:text-left">
      <a routerLink="/" fragment="gaston"
         class="inline-flex animate-float items-center gap-2 rounded-full border border-accent-400/30 bg-accent-400/10 px-4 py-1.5 text-sm font-medium text-accent-300 transition-all duration-300 hover:border-accent-400/60 hover:bg-accent-400/20">
        🚀 Nuevo lanzamiento: GastON v1.0
      </a>

      <h1 class="mt-6 font-display text-4xl font-bold leading-tight tracking-tight text-white sm:text-5xl lg:text-6xl">
        Software con alma.
        <span class="block bg-gradient-to-r from-primary-400 via-primary-300 to-accent-400 bg-clip-text text-transparent">
          Soluciones que liberan tu energía.
        </span>
      </h1>

      <p class="mx-auto mt-6 max-w-xl text-lg leading-relaxed text-graphite-300 lg:mx-0">
        Laboratorio de desarrollo enfocado en crear herramientas inteligentes, ágiles y pensadas para eliminar la carga mental.
      </p>

      <div class="mt-10 flex flex-col items-center gap-4 sm:flex-row sm:justify-center lg:justify-start">
        <!-- LANZAMIENTO: descomentar el CTA de WhatsApp.
        <a [href]="whatsappUrl" target="_blank" rel="noopener noreferrer"
           class="inline-flex w-full items-center justify-center rounded-full bg-accent-400 px-8 py-4 font-display text-base font-bold text-graphite-950 shadow-xl shadow-accent-400/25 transition-all duration-300 hover:-translate-y-1 hover:bg-accent-300 hover:shadow-accent-400/40 sm:w-auto">
          Hablar con GastON en WhatsApp 📲
        </a>
        -->
        <a routerLink="/" fragment="nosotros"
           class="inline-flex w-full items-center justify-center rounded-full border border-primary-400/40 px-8 py-4 font-display text-base font-semibold text-primary-200 transition-all duration-300 hover:border-primary-300 hover:bg-primary-400/10 sm:w-auto">
          Conocer el laboratorio
        </a>
      </div>
    </div>

    <div class="relative mx-auto hidden w-full max-w-xs justify-center lg:flex" aria-hidden="true">
      <div class="absolute inset-0 m-auto h-64 w-64 rounded-full bg-primary-500/20 blur-3xl"></div>
      <img src="assets/images/alkimyalabs-isotipo.png" alt="" width="429" height="647"
           class="relative h-auto w-56 drop-shadow-[0_0_24px_rgba(166,143,232,0.45)] transition-all duration-300 hover:scale-105" />
    </div>
  </div>
</section>
