@if (visible()) {
  <aside aria-label="Aviso de cookies"
         class="fixed inset-x-4 bottom-4 z-40 mx-auto max-w-xl rounded-2xl border border-white/10 bg-graphite-900/95 p-4 shadow-2xl shadow-black/40 backdrop-blur-lg sm:flex sm:items-center sm:gap-4 sm:p-5">
    <p class="text-sm leading-relaxed text-graphite-300">
      Usamos cookies de Google Analytics para saber cuántas personas visitan el sitio, de forma anónima.
      <a routerLink="/cookies" class="whitespace-nowrap text-accent-300 underline underline-offset-4 transition-all duration-300 hover:text-accent-400">Más información</a>
    </p>
    <button type="button" (click)="dismiss()"
            class="mt-3 w-full shrink-0 rounded-full bg-accent-400 px-5 py-2 font-display text-sm font-bold text-graphite-950 transition-all duration-300 hover:bg-accent-300 sm:mt-0 sm:w-auto">
      Entendido
    </button>
  </aside>
}
