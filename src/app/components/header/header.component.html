<header class="fixed inset-x-0 top-0 z-50 border-b border-white/5 bg-graphite-950/80 backdrop-blur-lg">
  <nav class="mx-auto flex h-16 max-w-6xl items-center justify-between px-4 sm:h-20 sm:px-6 lg:px-8" aria-label="Navegación principal">
    <a routerLink="/" fragment="inicio" (click)="closeMenu()" class="shrink-0 transition-all duration-300 hover:opacity-80">
      <img src="assets/images/alkimyalabs-logo.png" alt="Alkimya Labs" class="h-5 w-auto sm:h-6" width="967" height="151" />
    </a>

    <!-- Desktop -->
    <div class="hidden items-center gap-8 md:flex">
      <ul class="flex items-center gap-8">
        @for (link of navLinks; track link.fragment) {
          <li>
            <a routerLink="/" [fragment]="link.fragment"
               class="font-display text-sm font-semibold text-graphite-300 transition-all duration-300 hover:text-primary-300">
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
      <a [href]="whatsappUrl" target="_blank" rel="noopener noreferrer"
         class="rounded-full bg-accent-400 px-5 py-2.5 font-display text-sm font-bold text-graphite-950 shadow-lg shadow-accent-400/20 transition-all duration-300 hover:-translate-y-0.5 hover:bg-accent-300 hover:shadow-accent-400/40">
        Probar GastON
      </a>
    </div>

    <!-- Mobile toggle -->
    <button type="button" (click)="toggleMenu()"
            class="inline-flex h-10 w-10 items-center justify-center rounded-lg text-graphite-200 transition-all duration-300 hover:bg-white/5 md:hidden"
            [attr.aria-expanded]="menuOpen()" aria-controls="mobile-menu"
            [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'">
      @if (menuOpen()) {
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M6 6l12 12M18 6L6 18" /></svg>
      } @else {
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16" /></svg>
      }
    </button>
  </nav>

  <!-- Mobile menu -->
  @if (menuOpen()) {
    <div id="mobile-menu" class="border-t border-white/5 bg-graphite-950/95 px-4 pb-6 pt-2 md:hidden">
      <ul class="flex flex-col">
        @for (link of navLinks; track link.fragment) {
          <li>
            <a routerLink="/" [fragment]="link.fragment" (click)="closeMenu()"
               class="block rounded-lg px-3 py-3 font-display font-semibold text-graphite-200 transition-all duration-300 hover:bg-white/5 hover:text-primary-300">
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
      <a [href]="whatsappUrl" target="_blank" rel="noopener noreferrer" (click)="closeMenu()"
         class="mt-3 block rounded-full bg-accent-400 px-5 py-3 text-center font-display font-bold text-graphite-950 transition-all duration-300 hover:bg-accent-300">
        Probar GastON
      </a>
    </div>
  }
</header>
